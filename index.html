  <!-- MAP VIEWPORT -->
  <main id="map-viewport"></main>

  <!-- MOBILE BACKDROP -->
  <div class="mobile-drawer-backdrop" id="mobileDrawerBackdrop" onclick="window.closeMobileDrawer()"></div>

  <!-- FLOATING SIDEBAR PANEL (Drawer en móviles) -->
  <aside class="sidebar-panel" id="sidebarPanel">
    <div class="mobile-drag-handle" id="mobileDragHandle" onclick="window.closeMobileDrawer()">
      <span class="drag-bar"></span>
    </div>
    <div class="sidebar-header">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <span class="project-badge">Miraflores • San Isidro</span>
        <button class="btn-collapse" id="btnCollapseSidebar" onclick="window.closeMobileDrawer()" title="Cerrar panel" style="background: none; border: none; cursor: pointer; color: #999; font-size: 18px; padding: 4px;">✕</button>
      </div>
      <h1 class="project-title" id="projectTitle">Independencia & Teruel</h1>
      <p class="project-address" id="projectAddress">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Calle Teruel & Calle Independencia
      </p>
    </div>

    <!-- Category Filters -->
    <div class="category-section">
      <div class="section-label">
        <span>Categorías de Entorno</span>
        <span id="activeCountLabel">0 seleccionados</span>
      </div>

      <div class="category-list" id="categoryList">
        <button class="category-btn active" data-category="parques" onclick="window.selectCategory('parques')">
          <div class="cat-left">
            <span class="cat-icon">🌳</span>
            <span class="cat-text">Parques</span>
          </div>
          <span class="cat-count" id="count-parques">0</span>
        </button>

        <button class="category-btn" data-category="colegios" onclick="window.selectCategory('colegios')">
          <div class="cat-left">
            <span class="cat-icon">🎓</span>
            <span class="cat-text">Colegios</span>
          </div>
          <span class="cat-count" id="count-colegios">0</span>
        </button>

        <button class="category-btn" data-category="salud" onclick="window.selectCategory('salud')">
          <div class="cat-left">
            <span class="cat-icon">🏥</span>
            <span class="cat-text">Salud</span>
          </div>
          <span class="cat-count" id="count-salud">0</span>
        </button>

        <button class="category-btn" data-category="supermercados" onclick="window.selectCategory('supermercados')">
          <div class="cat-left">
            <span class="cat-icon">🛒</span>
            <span class="cat-text">Supermercados</span>
          </div>
          <span class="cat-count" id="count-supermercados">0</span>
        </button>

        <button class="category-btn" data-category="restaurantes" onclick="window.selectCategory('restaurantes')">
          <div class="cat-left">
            <span class="cat-icon">🍽️</span>
            <span class="cat-text">Restaurantes</span>
          </div>
          <span class="cat-count" id="count-restaurantes">0</span>
        </button>

        <button class="category-btn" data-category="cultura" onclick="window.selectCategory('cultura')">
          <div class="cat-left">
            <span class="cat-icon">🏛️</span>
            <span class="cat-text">Cultura & Ocio</span>
          </div>
          <span class="cat-count" id="count-cultura">0</span>
        </button>

        <button class="category-btn" data-category="todos" onclick="window.selectCategory('todos')">
          <div class="cat-left">
            <span class="cat-icon">✨</span>
            <span class="cat-text">Ver Todo el Entorno</span>
          </div>
          <span class="cat-count" id="count-todos">0</span>
        </button>

    <div class="search-container">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <!-- Footer Controls -->
    <div class="sidebar-footer">

      </label>
      <label class="switch-label">
        <input type="checkbox" id="toggleLabels" checked>

      </label>
    </div>

  <!-- Button to reopen sidebar when collapsed -->
  <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Abrir panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      <line x1="9" y1="3" x2="9" y2="21"></line>
    </svg>
  </button>

  <!-- FLOATING MAP CONTROLS -->
  <div class="map-controls-group">
    <button class="floating-btn" id="btnCenterProject" title="Centrar en el Proyecto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3"></circle>
        <line x1="12" y1="2" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>
    <button class="floating-btn" id="btnZoomIn" title="Acercar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button class="floating-btn" id="btnZoomOut" title="Alejar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- MAP BASE STYLE CHIP SELECTOR -->
  <div class="map-style-selector">
    <button class="style-chip active" data-style="positron">Minimalista</button>
    <button class="style-chip" data-style="streets">Calles</button>
    <button class="style-chip" data-style="satellite">Satelital</button>
  </div>

  <!-- BOTÓN FLOTANTE MÓVIL (CÍRCULO ROJO CC17 CON FLECHA HACIA ARRIBA EN BLANCO) -->
  <button class="mobile-hamburger-btn" id="mobileDrawerTrigger" onclick="window.toggleMobileDrawer()" aria-label="Abrir menú de lugares">
    <svg class="arrow-up-svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <div class="walking-legend" id="walkingLegend">
    <span class="walking-legend-title">Caminabilidad peatonal</span>
    <div class="legend-items">
      <div class="legend-item">
        <span class="legend-ring ring-5m"></span>
        <span>5 min (400m)</span>
      </div>
      <div class="legend-item">
        <span class="legend-ring ring-10m"></span>
        <span>10 min (800m)</span>
      </div>
    </div>
  </div>
